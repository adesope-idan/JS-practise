<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <title>Document</title>
</head>
<body class="flex flex-col justify-center items-center h-screen">

    <section id="loginSection" class="flex flex-col gap-5 h-screen justify-center items-center w-87.5">
        <h3 class="text-4xl font-semibold">Login</h3>
        <div class="flex flex-col gap-5 w-full">
            
            <input type="text" id="accNo" class=" border border-neutral-300 p-3" placeholder="Account No:">
            <input type="password" id="password" class=" border border-neutral-300 p-3" placeholder="password:">
            <button id="loginBtn" class="text-xl text-white font-medium bg-neutral-950 px-10 py-2 self-end">Login</button>
        </div>

        
    </section>

    <section id="servicesSection" class="hidden w-full h-full items-center flex flex-col  px-20 py-5">
        <header class="flex justify-between items-center w-full pb-20">
            <h3 class="text-3xl font-semibold">ABZ BANK</h3>

            <div class="flex gap-5 text-xl">
                <h2 id="userInfo_name">[name]</h2>
                <h2>
                    <span>Bal:</span>
                    <span id="userInfo_balance">[accBalance]</span>
                </h2>
            </div>
        </header>
        <div class="grid grid-cols-6 gap-10 w-3/4 font-semibold text-xl">
            <button id="btnOpenWithdrawModal" class="col-span-3 bg-neutral-300 rounded-3xl h-35">WITHDRAW</button>
            <button id="btnOpenDepositModal" class="col-span-3 bg-neutral-300 rounded-3xl h-35">DEPOSIT</button>
            <button id="btnOpenTransferModal" class="col-span-3 bg-neutral-300 rounded-3xl h-35">TRANSFER</button>
            <button id="btnOpenBuyAirtimeModal" class="col-span-3 bg-neutral-300 rounded-3xl h-35">BUY AIRTIME</button>
            <button id="pay-bills" class="col-span-3 bg-neutral-300 rounded-3xl h-35">PAY BILLS</button>
            <button id="btnOpenChangePinModal" class="col-span-3 bg-neutral-300 rounded-3xl h-35">CHANGE PIN</button>
        </div>  
        
        <div id="modal" class="hidden fixed bg-neutral-700/70 shadow w-full h-screen top-0 flex items-center justify-center">
            
            <div class="bg-white shadow rounded-2xl w-[25%] h-auto pb-10">
                <div class="flex justify-between p-5 pb-3">
                    <h3 class="title text-2xl">[Modal Title]</h3>
                    <img class="modal-close" src="./images/iconoir--xmark.svg" alt="">
                </div>

                <section id="withdrawModalSection" class="hidden px-5 flex flex-col gap-2">
                    <div class="flex flex-col gap-2">
                        <label for="slctBankOptions">Select a Nigerian Bank</label>
                        <select id="slctBankOptions" class="border w-full p-3">
                            <option>Option 1</option>
                            <option>GTBANK</option>
                            <option>Option 1</option>
                            <option>Option 1</option>
                        </select>
                    </div>
                    <div class="space-y-2 flex flex-col">
                        <label for="txtAccNo">Account No:</label>
                        <input id="txtAccNo" type="text" placeholder="Account no" class="p-3 border">
                    </div>
                    <div class="space-y-2 flex flex-col">
                        <label for="txtAmountToWithdraw">Amount:</label>
                        <input type="text" id="txtAmountToWithdraw" placeholder="Enter amount" class="border p-3">
                    </div>
                    
                    <button id="btnWithdraw" type="submit" class="bg-neutral-900 text-white p-3 mt-3">Withdraw</button>
                </section>

                <section id="depositModalSection" class="flex flex-col gap-5 px-5 hidden">
                    <div class="space-y-2 flex flex-col">
                        <label for="txtAmountToDeposit">Amount:</label>
                        <input type="text" id="txtAmountToDeposit" placeholder="Enter amount" class="border p-3">
                    </div>

                    <button id="btnDeposit" type="submit" class="bg-neutral-900 text-white p-3">Deposit</button>
                </section>

                <section id="transferModalSection" class="flex flex-col gap-5 px-5">
                    <div class="space-y-2 flex flex-col">
                        <label for="txtAccNoToTransferTo">Account No:</label>
                        <input id="txtAccNoToTransferTo" type="text" placeholder="Account no" class="p-3 border">
                    </div>
                    <div class="space-y-2 flex flex-col">
                        <label for="txtAmountToTransfer">Amount:</label>
                        <input type="text" id="txtAmountToTransfer" placeholder="Enter amount" class="border p-3">
                    </div>
                    <button id="btnTransfer" type="submit" class="bg-neutral-900 text-white p-3">Transfer</button>
                </section>


                <section id="buyAirtimeModalSection" class="flex flex-col gap-5 px-5">
                    <div class="flex flex-col gap-2">
                        <label for="slctServiceProvider">Select a Service Provider</label>
                        <select id="slctServiceProvider" class="border w-full p-3">
                            <option>AIRTEL</option>
                            <option>MTN</option>
                            <option>9-MOBILE</option>
                            <option>GLO</option>
                        </select>
                    </div>
                    <div class="space-y-2 flex flex-col">
                        <label for="txtNumberToBuyAirtimeTo">Enter Number</label>
                        <input id="txtNumberToBuyAirtimeTo" type="tel" placeholder="Enter Number" class="p-3 border">
                    </div>
                    <div class="space-y-2 flex flex-col">
                        <label for="txtAmountOfAirtimeToBuy">Amount:</label>
                        <input type="text" id="txtAmountOfAirtimeToBuy" placeholder="Enter amount" class="border p-3">
                    </div>
                    <button id="btnBuyAirtime" type="submit" class="bg-neutral-900 text-white p-3">PAY</button>
                </section>


                <section id="changePinModalSection" class="flex flex-col gap-5 px-5">
                    <div class="space-y-2 flex flex-col">
                        <label for="txtCurrPassword">Enter your current password</label>
                        <input id="txtcurrPassword" type="password" placeholder="current password:" class="p-3 border">
                    </div>
                    <div class="space-y-2 flex flex-col">
                        <label for="txtNewPassword">Enter your new password</label>
                        <input type="password" id="txtNewPassword" placeholder="new password" class="border p-3">
                    </div>
                    <button id="btnChangePin" type="submit" class="bg-neutral-900 text-white p-3">CHANGE PIN</button>
                </section>
            </div>
        </div>
        
    </section>
    

    
    <script src="index.js"></script>
</body>
</html>
